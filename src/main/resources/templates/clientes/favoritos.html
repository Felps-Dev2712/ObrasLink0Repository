<!doctype html><html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"><head th:replace="~{fragments/layout :: head('Meus favoritos - ObraLink')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container workspace-page" style="padding:48px 0;min-height:65vh"><p class="eyebrow">Sua lista</p><h1>Profissionais favoritos</h1><p th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></p><article class="professional-result" th:each="fav : ${favoritos}"><a th:href="@{/prestadores/{id}(id=${fav.id})}" th:text="${fav.nome}">Ver profissional</a><p th:text="${fav.categoria}">Especialidade</p><form th:action="@{/favoritos/{id}(id=${fav.id})}" method="post"><input type="hidden" name="adicionar" value="false"><button class="btn btn-outline">Remover</button></form></article><p th:if="${#lists.isEmpty(favoritos)}">Você ainda não salvou profissionais.</p></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
