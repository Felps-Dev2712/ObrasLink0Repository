<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${cliente.id == null ? 'Novo cliente - ObraLink' : 'Editar cliente - ObraLink'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container container-narrow page">
    <a href="/clientes" class="page-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Voltar</a>
    <header class="page-header">
        <div>
            <p class="eyebrow">Cliente</p>
            <h1 th:text="${cliente.id == null ? 'Novo cliente' : 'Editar cliente'}">Novo cliente</h1>
        </div>
    </header>

    <p th:if="${mensagemErro}" class="alert alert-error" role="alert" th:text="${mensagemErro}"></p>

    <div class="card" data-reveal>
        <div class="card-body">
            <form th:action="@{${cliente.id == null ? '/clientes' : '/clientes/' + cliente.id}}" th:object="${cliente}" method="post" data-submit-once>
                <fieldset class="form-section">
                    <legend>Dados pessoais</legend>
                    <p class="form-section-desc">Usados para identificar o cliente nos atendimentos.</p>
                    <div class="form-grid">
                        <div class="field"><label for="nome">Nome completo</label><input id="nome" type="text" th:field="*{nome}" autocomplete="name" required></div>
                        <div class="field"><label for="email">E-mail</label><input id="email" type="email" th:field="*{email}" required th:readonly="${not isAdmin}"></div>
                        <div class="field"><label for="cpfCnpj">CPF / CNPJ</label><input data-mask="documento" inputmode="text" autocapitalize="characters" spellcheck="false" id="cpfCnpj" type="text" th:field="*{cpfCnpj}" required></div>
                        <div class="field"><label for="telefone">Telefone / celular</label><input data-mask="telefone" inputmode="tel" autocomplete="tel-national" id="telefone" type="tel" th:field="*{telefone}" required></div>
                    </div>
                </fieldset>

                <fieldset class="form-section" data-address-picker>
                    <legend>Endereço</legend>
                    <div class="form-grid form-grid-address">
                        <div class="field col-2"><label for="cep">CEP</label><input id="cep" type="text" th:field="*{endereco.cep}" data-geo="cep" inputmode="numeric" maxlength="9" autocomplete="postal-code" required></div>
                        <div class="field col-4"><label for="logradouro">Logradouro</label><input id="logradouro" type="text" th:field="*{endereco.logradouro}" data-geo="logradouro" autocomplete="address-line1" required></div>
                        <div class="field col-2"><label for="numero">Número</label><input id="numero" type="text" th:field="*{endereco.numero}" data-geo="numero" required></div>
                        <div class="field col-4"><label for="complemento">Complemento</label><input id="complemento" type="text" th:field="*{endereco.complemento}" autocomplete="address-line2"></div>
                        <div class="field col-2"><label for="bairro">Bairro</label><input id="bairro" type="text" th:field="*{endereco.bairro}" data-geo="bairro" required></div>
                        <div class="field col-3"><label for="cidade">Cidade</label><input id="cidade" type="text" th:field="*{endereco.cidade}" data-geo="cidade" autocomplete="address-level2" required></div>
                        <div class="field col-1"><label for="estado">UF</label><input id="estado" type="text" th:field="*{endereco.estado}" data-geo="estado" maxlength="2" autocomplete="address-level1" required></div>
                    </div>
                    <input type="hidden" th:field="*{endereco.latitude}" data-geo="lat">
                    <input type="hidden" th:field="*{endereco.longitude}" data-geo="lng">
                    <div class="geo-picker">
                        <div class="geo-toolbar">
                            <span class="geo-status" data-geo-status aria-live="polite"></span>
                            <span class="cluster"><button type="button" class="btn btn-outline btn-sm" data-geo-buscar>Localizar no mapa</button></span>
                        </div>
                        <div class="geo-map" data-geo-map role="application" aria-label="Mapa do endereço. Clique ou arraste o marcador para ajustar."></div>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <a href="/clientes" class="btn btn-ghost">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar cliente</button>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
