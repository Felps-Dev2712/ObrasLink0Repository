<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Clientes - ObraLink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container page">
    <header class="page-header">
        <div>
            <p class="eyebrow">Administração</p>
            <h1>Clientes cadastrados</h1>
        </div>
        <div class="page-header-actions" th:if="${isAdmin}">
            <a href="/clientes/novo" class="btn btn-primary">+ Novo cliente</a>
        </div>
    </header>

    <div th:if="${mensagem}" class="alert alert-success" role="status"><span th:text="${mensagem}"></span></div>
    <div th:if="${mensagemErro}" class="alert alert-error" role="alert"><span th:text="${mensagemErro}"></span></div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col">Telefone</th>
                <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cliente : ${clientes}">
                <td><strong th:text="${cliente.nome}">Maria Santos</strong></td>
                <td th:text="${cliente.email}">maria@email.com</td>
                <td th:text="${cliente.telefoneFormatado}">(11) 99999-9999</td>
                <td>
                    <div class="cell-actions" th:if="${isAdmin or (auth['authenticated'] and auth['usuarioId'] == cliente.usuarioId)}">
                        <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}" class="btn btn-outline btn-sm">Editar</a>
                        <form th:action="@{/clientes/{id}/excluir(id=${cliente.id})}" method="post" onsubmit="return confirm('Tem certeza que deseja excluir este cliente?');">
                            <button type="submit" class="btn btn-danger-outline btn-sm">Excluir</button>
                        </form>
                    </div>
                    <span th:unless="${isAdmin or (auth['authenticated'] and auth['usuarioId'] == cliente.usuarioId)}" class="text-subtle">Somente leitura</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="4" class="table-empty">Nenhum cliente cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
