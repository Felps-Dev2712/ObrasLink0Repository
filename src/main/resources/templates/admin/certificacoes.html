<!doctype html><html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"><head th:replace="~{fragments/layout :: head('Revisão de certificações - ObraLink')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container workspace-page" style="padding:48px 0;min-height:65vh"><h1>Certificações pendentes</h1><p>Revise o documento e confirme os dados com a fonte emissora antes de aprovar.</p><p th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></p><p th:if="${mensagemErro}" class="alert alert-error" th:text="${mensagemErro}"></p><article class="certification-card" th:each="c : ${certificacoes}"><h2 th:text="${c.nome}">Certificação</h2><p th:text="${'Prestador #' + c.prestadorId + ' · ' + c.emissor + ' · Registro ' + (c.codigoRegistro ?: 'não informado')}"></p><p th:text="${c.dataEmissao + (c.dataValidade != null ? ' · validade ' + c.dataValidade : '')}"></p><a th:href="@{/certificacoes/{id}/documento(id=${c.id})}">Abrir documento</a><form th:action="@{/admin/certificacoes/{id}/validacao(id=${c.id})}" method="post" class="certification-form"><label>Observação/motivo<input name="observacao" maxlength="1000"></label><button class="btn btn-primary" name="estado" value="APROVADA">Aprovar</button><button class="btn btn-outline" name="estado" value="REPROVADA">Reprovar</button></form></article><p th:if="${#lists.isEmpty(certificacoes)}">Nenhuma certificação aguarda análise.</p></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
