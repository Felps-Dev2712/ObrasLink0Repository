<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Orçamento enviado - ObraLink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container container-narrow page review-page">
    <header class="page-header review-header">
        <div>
            <p class="eyebrow">Pronto</p>
            <h1>Abra o WhatsApp de cada profissional</h1>
            <p>O WhatsApp abre uma conversa por vez; clique em cada botão para enviar a mensagem correspondente.</p>
        </div>
    </header>

    <section class="card review-panel" data-reveal>
        <ul class="orcamento-enviado-list">
            <li th:each="resultado : ${resultados}">
                <strong th:text="${resultado.prestadorNome}">Profissional</strong>
                <a th:href="${resultado.linkWhatsapp}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">
                    <svg class="whatsapp-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.74.46 3.44 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2Zm0 1.67c2.21 0 4.29.86 5.85 2.42a8.2 8.2 0 0 1 2.42 5.82c0 4.55-3.71 8.25-8.27 8.25a8.3 8.3 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.27-4.38c0-4.55 3.71-8.25 8.26-8.25Zm-4.6 4.27c-.17 0-.45.06-.69.32-.24.26-.91.89-.91 2.17s.93 2.52 1.06 2.69c.13.17 1.82 2.9 4.5 3.95 2.22.88 2.67.7 3.15.66.48-.04 1.55-.63 1.77-1.24.22-.61.22-1.13.15-1.24-.06-.11-.24-.17-.5-.3-.26-.13-1.55-.77-1.79-.86-.24-.09-.41-.13-.59.13-.17.26-.67.86-.82 1.03-.15.17-.3.19-.56.06-.26-.13-1.09-.4-2.07-1.28-.76-.68-1.28-1.52-1.43-1.78-.15-.26-.02-.4.11-.53.12-.12.26-.3.39-.45.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.59-1.43-.81-1.96-.21-.51-.43-.44-.59-.45-.15-.01-.32-.01-.49-.01Z"/></svg>
                    Abrir WhatsApp
                </a>
            </li>
        </ul>
        <div class="review-actions">
            <p>Você também pode acompanhar essas conversas pela tela de <a href="/notificacoes">Atendimentos</a>.</p>
            <a href="/prestadores" class="btn btn-ghost">Voltar aos profissionais</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
