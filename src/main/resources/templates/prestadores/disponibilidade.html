<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Agenda - ObraLink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container container-narrow page workspace-page">
    <header class="page-header">
        <div>
            <p class="eyebrow">Perfil profissional</p>
            <h1>Disponibilidade semanal</h1>
            <p>Informe os dias e horários em que você atende. Os horários aparecem no seu perfil público. Períodos sobrepostos no mesmo dia não são aceitos.</p>
        </div>
    </header>

    <p th:if="${mensagem}" class="alert alert-success" role="status" th:text="${mensagem}"></p>
    <p th:if="${mensagemErro}" class="alert alert-error" role="alert" th:text="${mensagemErro}"></p>

    <div class="card" data-reveal>
        <div class="card-body">
            <form th:action="@{/prestadores/minha-disponibilidade}" method="post" id="availability-form">
                <div id="availability-rows">
                    <div class="availability-row" th:each="d,stat : ${disponibilidades}">
                        <label>Dia<select th:name="${'itens[' + stat.index + '].dia'}"><option th:each="dia : ${dias}" th:value="${dia}" th:text="${#strings.capitalize(#strings.toLowerCase(dia))}" th:selected="${dia == d.dia}"></option></select></label>
                        <label>Início<input type="time" th:name="${'itens[' + stat.index + '].inicio'}" th:value="${d.inicio}" required></label>
                        <label>Fim<input type="time" th:name="${'itens[' + stat.index + '].fim'}" th:value="${d.fim}" required></label>
                        <button type="button" class="btn btn-ghost remove-availability">Remover</button>
                    </div>
                    <div th:if="${#lists.isEmpty(disponibilidades)}" class="availability-row">
                        <label>Dia<select name="itens[0].dia" required><option value="">Selecione</option><option th:each="dia : ${dias}" th:value="${dia}" th:text="${#strings.capitalize(#strings.toLowerCase(dia))}"></option></select></label>
                        <label>Início<input type="time" name="itens[0].inicio" required></label>
                        <label>Fim<input type="time" name="itens[0].fim" required></label>
                        <button type="button" class="btn btn-ghost remove-availability">Remover</button>
                    </div>
                </div>
                <button type="button" id="add-availability" class="btn btn-outline btn-sm mt-16">+ Adicionar período</button>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar disponibilidade</button>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:inline="javascript">var days = /*[[${dias}]]*/ [];</script>
<script>
    (() => {
        const wrap = document.getElementById('availability-rows');
        const add = document.getElementById('add-availability');
        const label = d => d.charAt(0) + d.slice(1).toLowerCase();
        function renumber() {
            [...wrap.children].forEach((row, i) => row.querySelectorAll('[name]').forEach(el => el.name = el.name.replace(/itens\[\d+\]/, 'itens[' + i + ']')));
        }
        add.addEventListener('click', () => {
            const i = wrap.children.length;
            const row = document.createElement('div');
            row.className = 'availability-row';
            row.innerHTML = '<label>Dia<select name="itens[' + i + '].dia" required><option value="">Selecione</option>'
                + days.map(d => '<option value="' + d + '">' + label(d) + '</option>').join('')
                + '</select></label><label>Início<input type="time" name="itens[' + i + '].inicio" required></label>'
                + '<label>Fim<input type="time" name="itens[' + i + '].fim" required></label>'
                + '<button type="button" class="btn btn-ghost remove-availability">Remover</button>';
            wrap.appendChild(row);
            row.querySelector('select').focus();
        });
        wrap.addEventListener('click', e => {
            if (e.target.matches('.remove-availability')) { e.target.closest('.availability-row').remove(); renumber(); }
        });
    })();
</script>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
