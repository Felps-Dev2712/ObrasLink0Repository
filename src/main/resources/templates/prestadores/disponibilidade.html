<!doctype html><html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"><head th:replace="~{fragments/layout :: head('Disponibilidade - ObraLink')}"></head><body><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container workspace-page" style="padding:48px 0;min-height:65vh"><h1>Minha disponibilidade semanal</h1><p>Cadastre um ou mais intervalos por dia. Intervalos sobrepostos são rejeitados.</p><p th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></p><p th:if="${mensagemErro}" class="alert alert-error" th:text="${mensagemErro}"></p><form th:action="@{/prestadores/minha-disponibilidade}" method="post" id="availability-form"><div id="availability-rows"><div class="availability-row" th:each="d,stat : ${disponibilidades}"><label>Dia<select th:name="${'itens[' + stat.index + '].dia'}"><option th:each="dia : ${dias}" th:value="${dia}" th:text="${dia}" th:selected="${dia == d.dia}"></option></select></label><label>Início<input type="time" th:name="${'itens[' + stat.index + '].inicio'}" th:value="${d.inicio}" required></label><label>Fim<input type="time" th:name="${'itens[' + stat.index + '].fim'}" th:value="${d.fim}" required></label><button type="button" class="btn btn-outline remove-availability">Remover</button></div><div th:if="${#lists.isEmpty(disponibilidades)}" class="availability-row"><label>Dia<select name="itens[0].dia" required><option value="">Selecione</option><option th:each="dia : ${dias}" th:value="${dia}" th:text="${dia}"></option></select></label><label>Início<input type="time" name="itens[0].inicio" required></label><label>Fim<input type="time" name="itens[0].fim" required></label><button type="button" class="btn btn-outline remove-availability">Remover</button></div></div><button type="button" id="add-availability" class="btn btn-outline">Adicionar período</button> <button class="btn btn-primary">Salvar disponibilidade</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:inline="javascript">const days=/*[[${dias}]]*/[];</script><script>
(()=>{const wrap=document.getElementById('availability-rows'),add=document.getElementById('add-availability');function renumber(){[...wrap.children].forEach((row,i)=>row.querySelectorAll('[name]').forEach(el=>el.name=el.name.replace(/itens\[\d+\]/,'itens['+i+']')))}add.addEventListener('click',()=>{const i=wrap.children.length,row=document.createElement('div');row.className='availability-row';row.innerHTML='<label>Dia<select name="itens['+i+'].dia" required><option value="">Selecione</option>'+days.map(d=>'<option value="'+d+'">'+d+'</option>').join('')+'</select></label><label>Início<input type="time" name="itens['+i+'].inicio" required></label><label>Fim<input type="time" name="itens['+i+'].fim" required></label><button type="button" class="btn btn-outline remove-availability">Remover</button>';wrap.appendChild(row)});wrap.addEventListener('click',e=>{if(e.target.matches('.remove-availability')){e.target.closest('.availability-row').remove();renumber()}})})();</script><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
