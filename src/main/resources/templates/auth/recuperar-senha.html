<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Recuperar senha - ObraLink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main id="conteudo" class="container container-tight auth-page">
    <a href="/login" class="page-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Voltar para o login</a>
    <section class="auth-card" aria-labelledby="recover-title">
        <header class="auth-heading">
            <p class="eyebrow">Acesso à conta</p>
            <h1 id="recover-title">Recuperar senha</h1>
            <p>Informe o e-mail usado no cadastro. Se ele estiver associado a uma conta, você receberá as instruções.</p>
        </header>
        <div th:if="${mensagem}" class="alert alert-success" role="status"><span th:text="${mensagem}"></span></div>
        <form th:action="@{/recuperar-senha}" method="post" class="stack" data-submit-once>
            <div class="field">
                <label for="email">E-mail cadastrado</label>
                <input id="email" name="email" type="email" required autocomplete="email" placeholder="voce@exemplo.com">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Enviar instruções</button>
        </form>
        <p class="auth-footer-link">Lembrou a senha? <a href="/login">Entrar</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
