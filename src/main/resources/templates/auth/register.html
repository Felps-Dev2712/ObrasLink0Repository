<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:replace="~{fragments/layout :: head('Cadastro - Obras Link')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container auth-page" style="padding-top: 120px; padding-bottom: 60px; min-height: 80vh; max-width: 900px;">
    <div class="auth-card" style="background: #fff; border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow-sm);">
        <div class="auth-heading">
            <span class="eyebrow">Cadastro</span>
            <h2>Crie sua conta</h2>
            <p>Escolha como deseja usar a plataforma. Você pode atuar nos dois perfis com o mesmo acesso.</p>
        </div>

        <div th:if="${erro}" class="alert alert-danger"
             style="padding: 12px; background: #f8d7da; color: #721c24; border-radius: var(--radius-sm); margin-bottom: 16px;">
            <span th:text="${erro}"></span>
        </div>

        <form class="pure-form pure-form-stacked" th:action="@{/register}" th:object="${form}" method="post">
            <fieldset>
                <div class="pure-g">
                    <div class="pure-u-1 pure-u-md-1-2" style="padding-right: 16px;">
                        <label for="email">E-mail</label>
                        <input id="email" type="email" th:field="*{email}" class="pure-u-1" required>
                    </div>
                    <div class="pure-u-1 pure-u-md-1-4" style="padding-right: 16px;">
                        <label for="senha">Senha</label>
                        <input id="senha" type="password" th:field="*{senha}" class="pure-u-1" required minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres">
                    </div>
                    <div class="pure-u-1 pure-u-md-1-4">
                        <label for="confirmarSenha">Confirmar Senha</label>
                        <input id="confirmarSenha" type="password" th:field="*{confirmarSenha}" class="pure-u-1" required minlength="8" autocomplete="new-password" placeholder="Repita sua senha">
                    </div>
                </div>

                <div class="profile-choice" role="group" aria-label="Escolha os seus perfis">
                    <label class="profile-option" for="cadastroCliente">
                        <input id="cadastroCliente" type="checkbox" th:field="*{cadastroCliente}">
                        <span class="profile-option-icon" aria-hidden="true">C</span>
                        <span><strong>Sou cliente</strong><small>Quero encontrar profissionais.</small></span>
                    </label>
                    <label class="profile-option" for="cadastroPrestador">
                        <input id="cadastroPrestador" type="checkbox" th:field="*{cadastroPrestador}">
                        <span class="profile-option-icon" aria-hidden="true">P</span>
                        <span><strong>Sou prestador</strong><small>Quero oferecer meus serviços.</small></span>
                    </label>
                </div>
            </fieldset>

            <fieldset id="clienteFields" class="profile-fields" hidden>
                <legend>Dados de cliente</legend>
                <p class="profile-fields-description">Informe os dados para solicitar serviços e acompanhar sua obra.</p>
                <div class="pure-g">
                    <div class="pure-u-1 pure-u-md-1-3" style="padding-right: 16px;">
                        <label for="clienteNome">Nome</label>
                        <input id="clienteNome" type="text" th:field="*{clienteNome}" class="pure-u-1" data-profile-required>
                    </div>
                    <div class="pure-u-1 pure-u-md-1-3" style="padding-right: 16px;">
                        <label for="clienteCpfCnpj">CPF/CNPJ</label>
                        <input id="clienteCpfCnpj" type="text" th:field="*{clienteCpfCnpj}" class="pure-u-1" data-profile-required>
                    </div>
                    <div class="pure-u-1 pure-u-md-1-3">
                        <label for="clienteTelefone">Telefone</label>
                        <input id="clienteTelefone" type="text" th:field="*{clienteTelefone}" class="pure-u-1">
                    </div>
                </div>
            </fieldset>

            <fieldset id="prestadorFields" class="profile-fields" hidden>
                <legend>Dados de prestador</legend>
                <p class="profile-fields-description">Estes dados serão exibidos no seu perfil profissional.</p>
                <div class="pure-g">
                    <div class="pure-u-1 pure-u-md-1-3" style="padding-right: 16px;">
                        <label for="prestadorNome">Nome</label>
                        <input id="prestadorNome" type="text" th:field="*{prestadorNome}" class="pure-u-1" data-profile-required>
                    </div>
                    <div class="pure-u-1 pure-u-md-1-3" style="padding-right: 16px;">
                        <label for="prestadorCpfCnpj">CPF/CNPJ</label>
                        <input id="prestadorCpfCnpj" type="text" th:field="*{prestadorCpfCnpj}" class="pure-u-1" data-profile-required>
                    </div>
                    <div class="pure-u-1 pure-u-md-1-3">
                        <label for="categoriaId">Categoria</label>
                        <select id="categoriaId" th:field="*{categoriaId}" class="pure-u-1" data-profile-required>
                            <option value="">Selecione...</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                        </select>
                    </div>
                    <div class="pure-u-1 pure-u-md-1-3" style="padding-right: 16px; margin-top: 16px;">
                        <label for="prestadorWhatsapp">WhatsApp</label>
                        <input id="prestadorWhatsapp" type="text" th:field="*{prestadorWhatsapp}" class="pure-u-1" data-profile-required
                               placeholder="Ex: 11999999999">
                    </div>
                    <div class="pure-u-1" style="margin-top: 16px;">
                        <label for="prestadorDescricao">Descricao profissional</label>
                        <textarea id="prestadorDescricao" th:field="*{prestadorDescricao}" class="pure-u-1" rows="4"></textarea>
                    </div>
                </div>
            </fieldset>

            <div style="margin-top: 32px; display: flex; gap: 16px; justify-content: flex-end;">
                <a th:href="@{/login}" class="btn btn-outline"
                   style="border: 1px solid var(--color-border); color: var(--color-text);">Ja tenho conta</a>
                <button type="submit" class="btn btn-primary" style="border: none;">Criar Conta</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
    (() => {
        const cliente = document.getElementById('cadastroCliente');
        const prestador = document.getElementById('cadastroPrestador');
        const clienteFields = document.getElementById('clienteFields');
        const prestadorFields = document.getElementById('prestadorFields');

        function setRequired(container, active) {
            container.querySelectorAll('[data-profile-required]').forEach(input => input.required = active);
        }

        function updateProfiles() {
            clienteFields.hidden = !cliente.checked;
            prestadorFields.hidden = !prestador.checked;
            setRequired(clienteFields, cliente.checked);
            setRequired(prestadorFields, prestador.checked);
        }

        cliente.addEventListener('change', updateProfiles);
        prestador.addEventListener('change', updateProfiles);
        updateProfiles();
    })();
</script>

</body>

</html>
