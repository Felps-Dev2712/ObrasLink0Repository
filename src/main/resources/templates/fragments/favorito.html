<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="botao(prestadorId, favoritado)"
      class="favorite-heart-form"
      data-async-favorite
      th:action="@{/favoritos/{id}(id=${prestadorId})}"
      th:attr="data-async-action=@{/favoritos/{id}/alternar(id=${prestadorId})}"
      method="post">
    <input type="hidden" name="adicionar" th:value="${!favoritado}">
    <button type="submit" class="favorite-heart-button"
            th:classappend="${favoritado} ? ' is-favorite' : ''"
            th:attr="aria-label=${favoritado} ? 'Remover dos favoritos' : 'Adicionar aos favoritos', title=${favoritado} ? 'Remover dos favoritos' : 'Adicionar aos favoritos'">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>
    </button>
    <span class="sr-only" data-favorite-feedback role="status" aria-live="polite"></span>
</form>
</body>
</html>
