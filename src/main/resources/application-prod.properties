# Perfil de produção. Ative com SPRING_PROFILES_ACTIVE=prod.
# - Não cria dados de demonstração e exclui as contas de demonstração existentes,
#   mantendo só admin@obraslink.com (ver config/ProducaoBootstrap.java).
# - Exige OBRALINK_ADMIN_PASSWORD (mínimo 12 caracteres) e as variáveis SPRING_DATASOURCE_*.

obralink.admin.password=${OBRALINK_ADMIN_PASSWORD:}

# Sem valores padrão: a aplicação não sobe apontando para o banco local de desenvolvimento.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true
logging.level.com.obraslink=INFO

# Atrás de um proxy HTTPS (ex.: Caddy no deploy da Azure).
server.forward-headers-strategy=framework
